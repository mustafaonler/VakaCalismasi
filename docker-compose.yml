services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atmcash
      POSTGRES_USER: atmcash
      POSTGRES_PASSWORD: atmcash
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmcash -d atmcash"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=atmcash;Username=atmcash;Password=atmcash
      Security__CardHashSecret: compose-demo-card-hash-secret
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
